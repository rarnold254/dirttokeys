// ── AUTH PAGES ────────────────────────────────────────────────────────────────
function AuthPage({mode, onNav, onSuccess}) {
  const [email,setEmail]=useState('');
  const [password,setPassword]=useState('');
  const [name,setName]=useState('');
  const [project,setProject]=useState('');
  const [error,setError]=useState('');
  const [loading,setLoading]=useState(false);

  const handle = async () => {
    setLoading(true); setError('');
    if(mode==='login') {
      const {error:e} = await supabase.auth.signInWithPassword({email,password});
      if(e){setError(e.message);setLoading(false);}
      else onSuccess();
    } else {
      const {data,error:e} = await supabase.auth.signUp({email,password,options:{data:{full_name:name,project_name:project}}});
      if(e){setError(e.message);setLoading(false);}
      else {
        if(data.user) await supabase.from('projects').insert({user_id:data.user.id,name:project||'My Build',status:'active'});
        onSuccess();
      }
    }
  };

  return (
    <div style={{background:'#0a0d08',minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:24}}>
      <button onClick={()=>onNav('landing')} style={{background:'none',border:'none',cursor:'pointer',marginBottom:36}}><Logo size={26}/></button>
      <div className="card" style={{padding:'38px 34px',width:'100%',maxWidth:400,borderRadius:10}}>
        <h1 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:28,fontWeight:700,color:'#f0ebe0',marginBottom:4}}>{mode==='login'?'Welcome back':'Start building'}</h1>
        <p style={{fontSize:12,color:'#445',marginBottom:28}}>{mode==='login'?'Sign in to your build dashboard':'Free 14-day trial · No credit card required'}</p>
        {error && <div style={{background:'rgba(232,124,90,0.1)',border:'1px solid rgba(232,124,90,0.3)',borderRadius:6,padding:'9px 13px',fontSize:12,color:'#e87c5a',marginBottom:18}}>{error}</div>}
        {mode==='signup' && <>
          <label style={{fontSize:10,letterSpacing:2,color:'#445',display:'block',marginBottom:5}}>YOUR NAME</label>
          <input className="input" value={name} onChange={e=>setName(e.target.value)} placeholder="John Smith" style={{marginBottom:14}}/>
          <label style={{fontSize:10,letterSpacing:2,color:'#445',display:'block',marginBottom:5}}>YOUR BUILD NAME</label>
          <input className="input" value={project} onChange={e=>setProject(e.target.value)} placeholder="The Smith Build — Austin, TX" style={{marginBottom:14}}/>
        </>}
        <label style={{fontSize:10,letterSpacing:2,color:'#445',display:'block',marginBottom:5}}>EMAIL</label>
        <input className="input" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@email.com" style={{marginBottom:14}}/>
        <label style={{fontSize:10,letterSpacing:2,color:'#445',display:'block',marginBottom:5}}>PASSWORD</label>
        <input className="input" type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" style={{marginBottom:24}}/>
        <button className="btn-primary" onClick={handle} disabled={loading} style={{width:'100%',padding:13,opacity:loading?0.7:1}}>
          {loading?(mode==='login'?'Signing in...':'Creating account...'):(mode==='login'?'Sign In →':'Start Free Trial →')}
        </button>
        <div style={{textAlign:'center',marginTop:20,fontSize:12,color:'#334'}}>
          {mode==='login'?<>No account? <button onClick={()=>onNav('signup')} style={{background:'none',border:'none',color:'#8B6914',cursor:'pointer',fontSize:12}}>Start free trial</button></>
          :<>Already have an account? <button onClick={()=>onNav('login')} style={{background:'none',border:'none',color:'#8B6914',cursor:'pointer',fontSize:12}}>Sign in</button></>}
        </div>
      </div>
    </div>
  );
}

                  ))}
                  <div style={{display:'flex',gap:10,marginTop:4}}>
                    <button className="btn-primary" style={{padding:'10px 20px',fontSize:11,letterSpacing:1}}>EXPORT TO BUDGET →</button>
                    <button onClick={()=>setAiDone(false)} style={{padding:'10px 20px',background:'none',color:'#334',border:'1px solid #1e2830',borderRadius:6,fontSize:11,cursor:'pointer'}}>UPLOAD NEW PLANS</button>
                  </div>
                </div>
              )}
            </div>
          )}

        </div>
      </div>
    </div>
  );
}

// ── APP ROOT ──────────────────────────────────────────────────────────────────
function App() {
  const [page,setPage]=useState('landing');
  const [user,setUser]=useState(null);
  const [checking,setChecking]=useState(true);

  useEffect(()=>{
    supabase.auth.getSession().then(({data:{session}})=>{
      if(session){setUser(session.user);setPage('dashboard');}
      setChecking(false);
    });
    const {data:{subscription}} = supabase.auth.onAuthStateChange((_,session)=>{
      if(session){setUser(session.user);setPage('dashboard');}
      else{setUser(null);setPage('landing');}
    });
    return ()=>subscription.unsubscribe();
  },[]);

  const signOut = async()=>{
    await supabase.auth.signOut();
    setUser(null); setPage('landing');
  };

  if(checking) return <div style={{background:'#0a0d08',minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'#8B6914',fontSize:12,letterSpacing:3}}>LOADING...</div>;

  if(page==='dashboard'&&user) return <Dashboard user={user} onSignOut={signOut}/>;
  if(page==='login') return <AuthPage mode="login" onNav={setPage} onSuccess={()=>setPage('dashboard')}/>;
  if(page==='signup') return <AuthPage mode="signup" onNav={setPage} onSuccess={()=>setPage('dashboard')}/>;
  return <Landing onNav={setPage}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
